name: macOS CI

on:
  push:
    branches: [main, feat/mvp]
  pull_request:
    branches: [main]

jobs:
  swift-package:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Build package
        run: swift build
      - name: Run unit tests
        run: swift test
      - name: Build app bundle
        run: ./scripts/build-app.sh release

  xcode-ui-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run app and UI tests
        run: >-
          xcodebuild test
          -project FocusDive.xcodeproj
          -scheme FocusDive
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
