name: FocusDive
options:
  bundleIdPrefix: com.oliwiaui
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  FocusDiveCore:
    type: framework
    platform: macOS
    sources:
      - Sources/FocusDiveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliwiaui.focusdive.core
        GENERATE_INFOPLIST_FILE: YES
  FocusDive:
    type: application
    platform: macOS
    sources:
      - Sources/FocusDiveApp
    info:
      path: BuildSupport/FocusDive-Info.plist
      properties:
        CFBundleDisplayName: Focus Dive
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: 1
        NSHighResolutionCapable: true
        NSUserNotificationAlertStyle: banner
    dependencies:
      - target: FocusDiveCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oliwiaui.focusdive
        CODE_SIGN_STYLE: Automatic
  FocusDiveCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/FocusDiveCoreTests
    dependencies:
      - target: FocusDiveCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  FocusDiveUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests/FocusDiveUITests
    dependencies:
      - target: FocusDive
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  FocusDive:
    build:
      targets:
        FocusDive: all
        FocusDiveCore: all
        FocusDiveCoreTests: [test]
        FocusDiveUITests: [test]
    test:
      targets:
        - FocusDiveCoreTests
        - FocusDiveUITests
